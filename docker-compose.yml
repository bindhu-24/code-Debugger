services:
  db:
    image: pgvector/pgvector:pg16
    container_name: code-review-db
    environment:
      POSTGRES_USER: books_user
      POSTGRES_PASSWORD: StrongPassword2026
      POSTGRES_DB: books_db
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: code-review-api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://books_user:StrongPassword2026@db:5432/books_db